name: Refresh dashboard

on:
  # Primary: a Zapier schedule saves a file in triggers/ every day at 9:00 AM Eastern,
  # which starts this job right away.
  push:
    branches: [main]
    paths: ["triggers/**"]
  # Backup: GitHub's own scheduler (often late or skipped). Only builds if nothing
  # has built yet today and it's 10:00 AM Eastern or later.
  schedule:
    - cron: "7,17,27,37,47,57 14-20 * * *"
  workflow_dispatch:        # "Run workflow" button for manual refreshes

permissions:
  contents: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Gate
        id: gate
        run: |
          TODAY=$(TZ=America/New_York date +%F)
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "go=true" >> "$GITHUB_OUTPUT"
            echo "$TODAY" > last-scheduled-build.txt
            exit 0
          fi
          NOW=$(TZ=America/New_York date +%H%M)
          LAST=$(cat last-scheduled-build.txt 2>/dev/null || echo none)
          if [ $((10#$NOW)) -ge 1000 ] && [ "$LAST" != "$TODAY" ]; then
            echo "go=true" >> "$GITHUB_OUTPUT"
            echo "$TODAY" > last-scheduled-build.txt
          else
            echo "go=false" >> "$GITHUB_OUTPUT"
            echo "Skipping backup run: NY time $NOW, last build $LAST"
          fi
      - uses: actions/setup-node@v4
        if: steps.gate.outputs.go == 'true'
        with:
          node-version: 22
      - name: Build from HubSpot
        if: steps.gate.outputs.go == 'true'
        env:
          HUBSPOT_TOKEN: ${{ secrets.HUBSPOT_TOKEN }}
        run: node build.js
      - name: Encrypt with password
        if: steps.gate.outputs.go == 'true'
        env:
          DASHBOARD_PASSWORD: ${{ secrets.DASHBOARD_PASSWORD }}
        run: |
          npx --yes staticrypt@3 dist/index.html -p "$DASHBOARD_PASSWORD" --short -d . \
            --remember 30 \
            --template-title "323 Sports Sales Dashboard" \
            --template-instructions "Enter the password to view the dashboard." \
            --template-button "View dashboard" \
            --template-color-primary "#0f172a" --template-color-secondary "#f1f5f9"
      - name: Publish
        if: steps.gate.outputs.go == 'true'
        run: |
          git config user.name "dashboard-bot"
          git config user.email "dashboard-bot@users.noreply.github.com"
          git rm -r -q --ignore-unmatch triggers
          git add index.html .staticrypt.json last-scheduled-build.txt
          git diff --cached --quiet || git commit -m "Daily dashboard refresh"
          git push
